name: Build APK

# Push-trigger is disabled for now so mid-upload commits (placeholder
# files, icon fixes, etc.) don't each kick off a build. Trigger manually
# from the Actions tab when you're actually ready for a fresh APK:
# Actions -> Build APK -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # Shows up under the finished run, in the "Artifacts" section near
      # the bottom of the page — downloadable straight from a phone browser.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
