name: Build Nexus Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Nexus APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # Older Nexus commits may still contain the abandoned local speech
      # experiment. Remove those files in the CI checkout so this workflow
      # remains usable even before the cleaned source ZIP is uploaded.
      - name: Remove retired local speech runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            app/src/main/java/com/favpixel/nexus/PiperEngine.kt \
            app/src/main/java/com/favpixel/nexus/AndroidPiperTest.kt
          rm -rf app/src/main/assets/piper

      # Scan only build/runtime inputs. Do not scan this workflow or README
      # text, otherwise the check can match its own explanatory comments.
      - name: Confirm retired runtime is absent from build inputs
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_PATHS=(
            app/src/main/java
            app/src/main/assets
            app/src/main/res
            app/src/main/AndroidManifest.xml
            app/build.gradle
            build.gradle
            settings.gradle
          )
          EXISTING_PATHS=()
          for path in "${SEARCH_PATHS[@]}"; do
            if [[ -e "$path" ]]; then
              EXISTING_PATHS+=("$path")
            fi
          done
          if ((${#EXISTING_PATHS[@]} > 0)) && grep -RniE 'piper|onnx|PiperEngine|AndroidPiperTest' "${EXISTING_PATHS[@]}"; then
            echo 'Retired local speech runtime references found in build inputs.' >&2
            exit 1
          fi
          echo 'No retired local speech runtime references found in build inputs.'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-release-apk
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
